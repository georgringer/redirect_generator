<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:heading" /></h1>

    <div class="alert alert-info" role="alert">
        <h4 class="alert-title">redirect_generator_ui</h4>
        <p class="alert-message">
            The full import module is available in the
            <strong>redirect_generator_ui</strong> extension.
            Install it to enable bulk-importing redirects from CSV directly in the backend.
        </p>
    </div>

    <fieldset disabled="disabled" style="opacity:.5">

        <div class="mb-3">
            <label class="form-label">
                <f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.csvContent" />
            </label>
            <textarea class="form-control font-monospace" rows="12"
                placeholder="/old-path;https://example.com/new-path"></textarea>
            <div class="form-text">
                <f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.csvContent.description" />
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">
                    <f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.delimiter" />
                </label>
                <select class="form-select">
                    <option><f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.delimiter.semicolon" /></option>
                    <option><f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.delimiter.comma" /></option>
                    <option><f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.delimiter.tab" /></option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">
                    <f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.statusCode" />
                </label>
                <select class="form-select">
                    <option>307 &#x2013; Temporary Redirect</option>
                    <option>301 &#x2013; Moved Permanently</option>
                    <option>302 &#x2013; Found</option>
                    <option>303 &#x2013; See Other</option>
                </select>
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <div class="form-check mb-2">
                    <input type="checkbox" class="form-check-input" />
                    <label class="form-check-label">
                        <f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.dryRun" />
                    </label>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-primary">
            <f:translate key="LLL:EXT:redirect_generator/Resources/Private/Language/Modules/import.xlf:form.submit" />
        </button>

    </fieldset>

</f:section>

</html>
